
name: Actualizar alertas AEMET

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meteo-actualizacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

       - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar AEMET y generar mapa
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
        run: python actualizar.py

      - name: Guardar mapa actualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html alertas_edificios.html

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi

          git commit -m "Actualizar alertas AEMET"

          for intento in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Alertas publicadas correctamente"
                exit 0
              fi
            else
              echo "Conflicto al integrar los cambios"
              git rebase --abort || true
              exit 1
            fi

            echo "Reintentando publicación..."
            sleep 5
          done

          echo "No se pudieron publicar los cambios"
          exit 1
