name: Actualizar alertas AEMET
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar AEMET y generar mapa
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python actualizar.py
      - name: Guardar mapa actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html alertas_edificios.html geocache.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar alertas AEMET"
            git pull --rebase origin main
            git push origin main
          fi


