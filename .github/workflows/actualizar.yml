name: Actualizar alertas AEMET
concurrency:
  group: meteo-actualizacion
  cancel-in-progress: true
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar AEMET y generar mapa
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python actualizar.py
      - name: Guardar mapa actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html alertas_edificios.html

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi

          git commit -m "Actualizar alertas AEMET"

          git fetch origin main
          git push origin HEAD:main
