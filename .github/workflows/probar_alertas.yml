name: Probar alertas naranja y roja

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simular alertas y enviar correos
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          SMTP_REMITENTE: ${{ secrets.SMTP_REMITENTE }}
        run: python probar_alertas.py
